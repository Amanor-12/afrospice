# Staging-oriented example for running the web tier.
# Copy deploy/env/backend.staging.env.example to deploy/env/backend.staging.env first.

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ./env/backend.staging.env
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 5000) + '/api/system/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
        VITE_BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8081:80"
