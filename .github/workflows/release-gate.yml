name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Start Mongo replica set
        run: |
          docker run -d --name afrospice-mongo -p 27018:27018 mongo:8.0 --replSet rs0 --bind_ip_all --port 27018

          for i in {1..60}; do
            if docker exec afrospice-mongo mongosh --port 27018 --quiet --eval "db.adminCommand({ ping: 1 }).ok" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          docker exec afrospice-mongo mongosh --port 27018 --quiet --eval "try { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27018'}]}) } catch (e) { if (!/already initialized/i.test(e.message)) throw e }"

          for i in {1..60}; do
            if docker exec afrospice-mongo mongosh --port 27018 --quiet --eval "const hello = db.hello(); quit(hello.isWritablePrimary ? 0 : 1)" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Write backend CI env
        run: |
          cat > backend/src/.env <<'EOF'
          PORT=5000
          NODE_ENV=development
          MONGO_URI=mongodb://127.0.0.1:27018/afrospice?replicaSet=rs0
          FRONTEND_ORIGIN=http://localhost:5173
          PUBLIC_BASE_URL=http://127.0.0.1:5000
          ALLOWED_HOSTS=127.0.0.1,localhost
          TRUST_PROXY=false
          ENFORCE_HTTPS=false
          JWT_SECRET=ci-only-secret-ci-only-secret-ci-only-secret-1234
          JWT_ISSUER=afrospice-api
          JWT_AUDIENCE=afrospice-workspace
          JWT_EXPIRES=12h
          AUTH_COOKIE_NAME=afrospice_session
          AUTH_COOKIE_SECURE=false
          AUTH_COOKIE_SAMESITE=strict
          BOOTSTRAP_SAMPLE_DATA=false
          EXTERNAL_ASSISTANT_ENABLED=false
          EOF

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Seed runtime data
        run: npm --prefix backend run db:bootstrap

      - name: Run release gate
        run: npm run verify:release:local

      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run browser E2E smoke
        env:
          E2E_OWNER_PIN: "1234"
        run: npm run verify:browser:e2e

      - name: Run load smoke
        run: npm run verify:load:smoke

      - name: Cleanup Mongo container
        if: always()
        run: docker rm -f afrospice-mongo || true

  container-build:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t afrospice-backend .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t afrospice-frontend .
